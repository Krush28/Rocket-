<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KrishiMitra phone assistant</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet">
<style>body{margin:0}button{font-family:inherit}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#0F3D2E;color:#F3F1E8;font-family:'Instrument Sans','Noto Sans Devanagari',system-ui,sans-serif;display:flex;flex-direction:column;padding:28px 22px 24px;overflow:hidden">
 <div style="display:flex;align-items:center;justify-content:space-between">
  <div style="display:flex;align-items:center;gap:10px">
   <div style="width:36px;height:36px;border-radius:10px;background:#F2B01E;display:grid;place-items:center"><svg width="22" height="22" viewBox="0 0 26 26" fill="none" stroke="#11221A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 4v17M8 22h10M4 9h18"/><path d="M4 9l-2.5 6h5zM22 9l-2.5 6h5z"/></svg></div>
   <div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:22px;letter-spacing:-0.03em">KrishiMitra</div>
  </div>
  <div style="display:inline-flex;background:#1C5A43;border-radius:10px;padding:3px">
   <button style="border:0;background:#F3F1E8;color:#11221A;border-radius:8px;padding:0 11px;min-height:36px;font-weight:600">EN</button>
   <button style="border:0;background:transparent;color:#F3F1E8;border-radius:8px;padding:0 11px;min-height:36px">हिं</button>
   <button style="border:0;background:transparent;color:#F3F1E8;border-radius:8px;padding:0 11px;min-height:36px">मरा</button>
  </div>
 </div>

 <div style="margin-top:34px;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:34px;line-height:1.1;letter-spacing:-0.03em">What do you want<br>to sell today?</div>
 <div style="margin-top:12px;color:#A9C9B4;font-size:16px">Say your crop, amount and village. I find where you keep the most after costs.</div>

 <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px">
  <div style="display:flex;align-items:flex-end;gap:5px;height:44px" aria-hidden="true">
   <span style="width:5px;height:14px;border-radius:3px;background:#3B6F59"></span><span style="width:5px;height:26px;border-radius:3px;background:#5E9C80"></span><span style="width:5px;height:40px;border-radius:3px;background:#7BD389"></span><span style="width:5px;height:22px;border-radius:3px;background:#5E9C80"></span><span style="width:5px;height:34px;border-radius:3px;background:#7BD389"></span><span style="width:5px;height:16px;border-radius:3px;background:#3B6F59"></span><span style="width:5px;height:28px;border-radius:3px;background:#5E9C80"></span>
  </div>
  <button aria-label="Tap to speak" style="width:128px;height:128px;border-radius:50%;border:0;background:#F2B01E;display:grid;place-items:center;box-shadow:0 0 0 12px #2D6A52,0 0 0 26px #1C5A43">
   <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#11221A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3" fill="#11221A"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
  </button>
  <div style="font-weight:600;font-size:17px;margin-top:12px">Tap and speak</div>
 </div>

 <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
  <button style="border:0;background:#1C5A43;color:#F3F1E8;border-radius:999px;padding:0 16px;min-height:44px;font-size:15px">200 quintal onion, Niphad</button>
  <button style="border:0;background:#1C5A43;color:#F3F1E8;border-radius:999px;padding:0 16px;min-height:44px;font-size:15px">1,000 kg tomato, Ponda</button>
 </div>
 <label for="m" style="position:absolute;left:-9999px">Message</label>
 <div style="display:flex;gap:10px">
  <input id="m" type="text" placeholder="Or type here" style="flex:1;min-height:52px;border-radius:26px;border:0;background:#F3F1E8;padding:0 20px;font:inherit;color:#11221A">
  <button aria-label="Send" style="width:52px;height:52px;border-radius:50%;border:0;background:#F2B01E;display:grid;place-items:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#11221A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
 </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

</body>
</html>
